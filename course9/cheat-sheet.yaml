cheat_sheet_title: "Course 9 Cheat Sheet"
sections:
  - title: "HTTP/REST"
    items:
      - command: "GET /resources"
        description: "List resources"
      - command: "GET /resources/{id}"
        description: "Get single resource"
      - command: "POST /resources"
        description: "Create new resource"
      - command: "PUT /resources/{id}"
        description: "Update entire resource"
      - command: "PATCH /resources/{id}"
        description: "Partial update"
      - command: "DELETE /resources/{id}"
        description: "Delete resource"
      - command: "200 OK"
        description: "Request succeeded"
      - command: "201 Created"
        description: "Resource created"
      - command: "400 Bad Request"
        description: "Invalid input"
      - command: "401 Unauthorized"
        description: "Not authenticated"
      - command: "403 Forbidden"
        description: "Authenticated but not authorized"
      - command: "404 Not Found"
        description: "Resource doesn't exist"
      - command: "429 Too Many Requests"
        description: "Rate limit exceeded"
      - command: "500 Internal Server Error"
        description: "Server error"
  
  - title: "FastAPI Basics"
    items:
      - command: "@app.get('/path')"
        description: "Define GET endpoint"
      - command: "@app.post('/path')"
        description: "Define POST endpoint"
      - command: "uvicorn main:app --reload"
        description: "Run FastAPI app"
      - command: "http://localhost:8000/docs"
        description: "Interactive API documentation"
      - command: "Depends(get_db)"
        description: "Dependency injection"
  
  - title: "Pydantic Validation"
    items:
      - command: "class Model(BaseModel):"
        description: "Define request/response model"
      - command: "Field(..., min_length=3)"
        description: "Validation constraint"
      - command: "EmailStr"
        description: "Email validation type"
      - command: "@validator('field')"
        description: "Custom field validator"
  
  - title: "Authentication"
    items:
      - command: "pwd_context.hash(password)"
        description: "Hash password with bcrypt"
      - command: "pwd_context.verify(plain, hashed)"
        description: "Verify password"
      - command: "jwt.encode(data, SECRET_KEY, algorithm='HS256')"
        description: "Create JWT token"
      - command: "jwt.decode(token, SECRET_KEY, algorithms=['HS256'])"
        description: "Verify JWT token"
      - command: "OAuth2PasswordBearer(tokenUrl='token')"
        description: "OAuth2 scheme for JWT"
  
  - title: "SQLAlchemy"
    items:
      - command: "create_engine('postgresql://...')"
        description: "Create database connection"
      - command: "class Model(Base):"
        description: "Define database model"
      - command: "Column(Integer, primary_key=True)"
        description: "Define column"
      - command: "ForeignKey('table.id')"
        description: "Foreign key relationship"
      - command: "relationship('Model', back_populates='field')"
        description: "Define relationship"
      - command: "session.query(Model).all()"
        description: "Query all records"
      - command: "session.query(Model).filter_by(id=1).first()"
        description: "Filter query"
      - command: "session.add(obj)"
        description: "Add to session"
      - command: "session.commit()"
        description: "Commit transaction"
      - command: "session.rollback()"
        description: "Rollback transaction"
      - command: "joinedload(Model.relationship)"
        description: "Eager load relationship"
      - command: "selectinload(Model.collection)"
        description: "Eager load collection"
  
  - title: "Alembic Migrations"
    items:
      - command: "alembic init alembic"
        description: "Initialize Alembic"
      - command: "alembic revision --autogenerate -m 'message'"
        description: "Create migration from models"
      - command: "alembic upgrade head"
        description: "Apply all migrations"
      - command: "alembic downgrade -1"
        description: "Rollback one migration"
      - command: "alembic current"
        description: "Show current migration"
      - command: "alembic history"
        description: "Show all migrations"
  
  - title: "Redis Caching"
    items:
      - command: "cache.set('key', 'value')"
        description: "Store value"
      - command: "cache.get('key')"
        description: "Retrieve value"
      - command: "cache.set('key', 'value', ex=60)"
        description: "Store with 60s expiration"
      - command: "cache.delete('key')"
        description: "Delete key"
      - command: "cache.exists('key')"
        description: "Check if key exists"
      - command: "cache.ttl('key')"
        description: "Get time to live"
      - command: "cache.hset('hash', 'field', 'value')"
        description: "Store hash field"
      - command: "cache.hgetall('hash')"
        description: "Get all hash fields"
  
  - title: "Background Jobs (ARQ)"
    items:
      - command: "async def task(ctx, arg):"
        description: "Define background task"
      - command: "redis.enqueue_job('task', arg)"
        description: "Queue background job"
      - command: "arq worker.WorkerSettings"
        description: "Start ARQ worker"
      - command: "max_tries=3"
        description: "Configure retries"
  
  - title: "Common Patterns"
    items:
      - command: "def get_db():"
        description: "Database session dependency"
      - command: "def get_current_user():"
        description: "Auth dependency"
      - command: "def require_admin():"
        description: "Admin authorization check"
      - command: "@app.middleware('http')"
        description: "Define middleware"
      - command: "request.state.correlation_id"
        description: "Store request data"
      - command: "BackgroundTasks"
        description: "Simple background tasks"
  
  - title: "Security"
    items:
      - command: "Never commit .env"
        description: "Secrets go in environment variables"
      - command: "Use ORM, not raw SQL"
        description: "Prevent SQL injection"
      - command: "Hash passwords with bcrypt"
        description: "Never store plaintext passwords"
      - command: "Validate all input"
        description: "Use Pydantic models"
      - command: "Rate limit auth endpoints"
        description: "Prevent brute force"
      - command: "Check authorization on every request"
        description: "Don't rely on client checks"
  
  - title: "Production Checklist"
    items:
      - command: "DEBUG=False"
        description: "Disable debug in production"
      - command: "Connection pooling configured"
        description: "Set pool_size, max_overflow"
      - command: "Health check endpoint"
        description: "For load balancers"
      - command: "Structured logging"
        description: "JSON logs with correlation IDs"
      - command: "Error tracking"
        description: "Capture exceptions with context"
      - command: "Caching for expensive queries"
        description: "Redis with TTL"
      - command: "Background jobs for slow tasks"
        description: "Don't block requests"
      - command: "Database migrations"
        description: "Version control schema"
      - command: "Secrets in environment"
        description: "Never hardcode"
      - command: "Input validation"
        description: "Pydantic everywhere"
      - command: "Rate limiting"
        description: "Prevent abuse"
      - command: "Pagination"
        description: "Limit query results"
