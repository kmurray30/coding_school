  - "What happens when the connection pool is exhausted?"
  - "How do you configure pool size in SQLAlchemy?"
  - "What is pool_pre_ping and why would you enable it?"
  - "What is the formula for offset in pagination? (page number to offset)"
  - "What's the main problem with offset pagination at large offsets?"
  - "How does cursor pagination work?"
  - "What are the advantages of cursor pagination over offset?"
  - "When would you choose offset over cursor pagination?"
  - "What is the N+1 query problem?"
  - "How do you fix N+1 problems in SQLAlchemy?"
  - "Why is proper session management important in FastAPI?"
  - "What's wrong with creating a global database session?"
  - "How do you ensure database sessions are always closed?"
  - "What are read replicas?"
  - "What is replication lag?"
  - "When should you use read replicas?"
  - "What's the difference between synchronous and asynchronous replication?"
