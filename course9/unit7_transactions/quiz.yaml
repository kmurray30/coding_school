quiz_title: "Unit 7 Quiz: Transactions and Isolation"
questions:
  - "What do the letters in ACID stand for?"
  - "What does atomicity mean in database transactions?"
  - "What does consistency mean in ACID?"
  - "What does isolation mean in ACID?"
  - "What does durability mean in ACID?"
  - "What's the difference between commit and rollback?"
  - "What are the four isolation levels from strictest to loosest?"
  - "What is a dirty read?"
  - "What is a non-repeatable read?"
  - "What is a phantom read?"
  - "Which isolation level prevents all three anomalies (dirty, non-repeatable, phantom)?"
  - "What is PostgreSQL's default isolation level?"
  - "When should you use SERIALIZABLE isolation?"
  - "When should you use READ COMMITTED isolation?"
  - "What is optimistic locking?"
  - "How do you implement optimistic locking with version numbers?"
  - "Why is it important to have automatic rollback on errors in FastAPI?"
  - "Write a FastAPI dependency that provides a database session with automatic commit/rollback"
