quiz_title: "Unit 6 Quiz: ORM Patterns and Performance"
questions:
  - "What is the N+1 query problem?"
  - "How do you fix the N+1 problem in SQLAlchemy?"
  - "What's the difference between lazy loading and eager loading?"
  - "When should you use joinedload()?"
  - "When should you use selectinload()?"
  - "Write a query that filters books where year > 2000 and orders by title"
  - "How do you limit query results to 10 items?"
  - "How do you implement pagination with offset and limit?"
  - "When should you use raw SQL instead of the ORM?"
  - "How do you execute raw SQL safely (avoiding SQL injection)?"
  - "What does EXPLAIN do in SQL?"
  - "What is a database index and when should you add one?"
  - "What are the downsides of having too many indexes?"
  - "How do you add an index to a column in SQLAlchemy?"
  - "What's the difference between a sequential scan and an index scan?"
  - "How can you identify slow queries in your application?"
  - "Is it better to optimize early or measure first? Why?"
