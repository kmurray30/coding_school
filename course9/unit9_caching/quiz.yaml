quiz_title: "Unit 9 Quiz: Caching with Redis"
questions:
  - "What problems does caching solve?"
  - "When does caching hurt performance instead of helping?"
  - "What is TTL and why is it important?"
  - "What is the cache-aside pattern?"
  - "What's the difference between cache-aside and write-through caching?"
  - "What Redis command sets a value with expiration?"
  - "How do you check the remaining TTL for a key?"
  - "What are Redis hashes and when should you use them?"
  - "What are Redis sets and when should you use them?"
  - "What is cache invalidation?"
  - "What happens if you don't invalidate cache when data changes?"
  - "What is a cache stampede and how do you prevent it?"
  - "Why shouldn't you cache personalized data?"
  - "What's a good cache hit rate to aim for?"
  - "What does it mean if your cache hit rate is 5%?"
  - "Should you cache database query results that change every second? Why or why not?"
  - "How do you connect to Redis in Python?"
  - "Write code to cache a value for 5 minutes in Redis"
