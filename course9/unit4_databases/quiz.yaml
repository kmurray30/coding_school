quiz_title: "Unit 4 Quiz: Relational Databases with SQLAlchemy"
questions:
  - "What are the three main components of a relational database (tables, ..., ...)?"
  - "What is a primary key and why does every table need one?"
  - "What is a foreign key and how does it create relationships between tables?"
  - "What's the difference between one-to-many and many-to-many relationships?"
  - "When do you need an association table?"
  - "What does nullable=False mean on a column?"
  - "What does unique=True mean on a column?"
  - "How do you set a default value for a column in SQLAlchemy?"
  - "What are the four CRUD operations?"
  - "Write SQLAlchemy code to query all users with username 'alice'"
  - "What is database normalization?"
  - "When should you denormalize data?"
  - "What's the difference between SQLAlchemy Core and SQLAlchemy ORM?"
  - "Why use session.commit() after adding/modifying records?"
  - "How do you create a relationship in SQLAlchemy?"
  - "What does back_populates do in a relationship?"
  - "How do you integrate SQLAlchemy with FastAPI using dependencies?"
