quiz_title: "Unit 2 Quiz: Middleware and Cross-Cutting Concerns"
questions:
  - "What is middleware in FastAPI?"
  - "What does CORS stand for and why does it exist?"
  - "How do you add middleware to a FastAPI application?"
  - "In what order does middleware execute (request → handler → response)?"
  - "What's the difference between middleware and dependencies?"
  - "How do you attach data to a request so all handlers can access it?"
  - "What does Depends() do in FastAPI?"
  - "Can a dependency function depend on another dependency? Give an example."
  - "What happens if you don't add CORS middleware and try to call your API from a browser on a different origin?"
  - "Write middleware that adds an X-API-Version header to every response"
  - "What are common use cases for custom middleware?"
  - "How do you measure request duration in middleware?"
