quiz_title: "Unit 12 Quiz: Observability"
questions:
  - "What is structured logging and why is it better than unstructured logs?"
  - "What are the standard log levels and when should you use each?"
  - "Should you log at DEBUG level in production? Why or why not?"
  - "What is a correlation ID and why is it useful?"
  - "How do correlation IDs help debug distributed systems?"
  - "What's the difference between metrics and logs?"
  - "What are the three types of Prometheus metrics?"
  - "What is a counter metric and what is it used for?"
  - "What is a gauge metric and what is it used for?"
  - "What is a histogram metric and what is it used for?"
  - "What's the difference between a health check and a readiness probe?"
  - "What's the difference between a liveness probe and a readiness probe?"
  - "When should a liveness probe fail?"
  - "When should a readiness probe fail?"
  - "What happens when a liveness probe fails in Kubernetes?"
  - "What happens when a readiness probe fails in Kubernetes?"
  - "What context should you include when capturing exceptions?"
  - "Why is it important to track error rates, not just error counts?"
