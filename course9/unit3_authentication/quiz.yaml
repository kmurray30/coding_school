quiz_title: "Unit 3 Quiz: Authentication and Authorization"
questions:
  - "Why should you never store passwords in plaintext?"
  - "What does bcrypt do differently than regular hashing (like SHA256)?"
  - "What are the main differences between session-based and JWT-based auth?"
  - "When should you use sessions instead of JWT?"
  - "When should you use JWT instead of sessions?"
  - "What are the three parts of a JWT token?"
  - "Can you read the contents of a JWT token without the secret key?"
  - "Can you modify a JWT token without the secret key?"
  - "What happens if a JWT token expires?"
  - "Write code to create a JWT token that expires in 1 hour"
  - "What HTTP status code should you return for 'not authenticated'?"
  - "What HTTP status code should you return for 'authenticated but not authorized'?"
  - "What's the difference between authentication and authorization?"
  - "How do you extract the current user in FastAPI using Depends()?"
  - "What is OAuth2 Password flow?"
  - "How do you implement role-based access control (RBAC) in FastAPI?"
  - "Where should you store your JWT secret key?"
  - "What should you do if your JWT secret key is leaked?"
