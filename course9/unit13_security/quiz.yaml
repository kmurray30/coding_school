quiz_title: "Unit 13 Quiz: API Security and Robustness"
questions:
  - "What does OWASP stand for?"
  - "What is broken access control?"
  - "What is SQL injection and how do you prevent it?"
  - "Why should you never concatenate user input into SQL queries?"
  - "What is the difference between authentication and authorization?"
  - "What HTTP status code means 'not authenticated'?"
  - "What HTTP status code means 'authenticated but not authorized'?"
  - "What is rate limiting and why is it important?"
  - "How many login attempts should you allow per minute before rate limiting?"
  - "What is an idempotency key?"
  - "Why are idempotency keys important for payment processing?"
  - "What is RBAC (Role-Based Access Control)?"
  - "Where should you store secrets (API keys, passwords)?"
  - "Why should you never commit .env files to git?"
  - "What's the difference between encryption and hashing?"
  - "Should you encrypt or hash passwords?"
  - "Why should you use bcrypt instead of SHA256 for passwords?"
  - "What are some examples of security headers?"
  - "What is CORS and why does it exist?"
  - "What should you include in error messages for security reasons?"
