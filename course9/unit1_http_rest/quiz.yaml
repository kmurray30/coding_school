quiz_title: "Unit 1 Quiz: HTTP/REST in Practice"
questions:
  - "What HTTP method should you use to create a new resource?"
  - "What HTTP status code indicates a resource was successfully created?"
  - "What's the difference between path parameters and query parameters? Give an example of when to use each."
  - "Write the FastAPI route decorator for a DELETE endpoint at /users/{user_id}"
  - "What happens if you send a request body to a Pydantic model endpoint with a missing required field?"
  - "Why does FastAPI automatically generate API documentation at /docs?"
  - "What HTTP status code means 'resource not found'?"
  - "What HTTP status code means 'unauthorized' (not logged in)?"
  - "In REST, what URL pattern would you use to get all comments for post #5?"
  - "What's the advantage of using response_model in FastAPI?"
  - "How do you make a query parameter optional with a default value?"
  - "What HTTP methods are used for a full CRUD API (Create, Read, Update, Delete)?"
