quiz_title: "Unit 11 Quiz: File Storage and Webhooks"
questions:
  - "What should you validate when accepting file uploads?"
  - "Why is it important to limit file upload sizes?"
  - "What's the difference between local storage and object storage (S3)?"
  - "When should you use S3 instead of local storage?"
  - "What is a signed URL and why would you use one?"
  - "How do signed URLs expire?"
  - "What is a webhook?"
  - "How do webhooks differ from regular API calls?"
  - "Why should webhook endpoints return 200 OK quickly?"
  - "What is webhook signature verification and why is it important?"
  - "What algorithm is commonly used for webhook signatures?"
  - "What is idempotency in the context of webhooks?"
  - "Why might a webhook be delivered multiple times?"
  - "How do you make a webhook handler idempotent?"
  - "What is exponential backoff in webhook retries?"
  - "What should you do if a webhook fails after all retries?"
  - "Should you process webhook data synchronously or asynchronously? Why?"
  - "What headers should you include when sending a webhook?"
