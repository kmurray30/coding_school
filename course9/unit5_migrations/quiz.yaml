quiz_title: "Unit 5 Quiz: Database Migrations with Alembic"
questions:
  - "Why do database migrations exist?"
  - "What problems happen when you don't use migrations?"
  - "What command initializes Alembic in a project?"
  - "What command creates a new migration with auto-generated changes?"
  - "What command applies all pending migrations?"
  - "What command rolls back one migration?"
  - "What are the two functions in every Alembic migration file?"
  - "What does the upgrade() function do?"
  - "What does the downgrade() function do?"
  - "Why must every migration be reversible?"
  - "Where are migration files stored in an Alembic project?"
  - "What is a data migration and when do you need one?"
  - "How do you run custom SQL in a migration?"
  - "What happens if you edit a migration file that's already been applied to production?"
  - "How do you check which migrations have been applied to your database?"
  - "What's the difference between `alembic revision` and `alembic revision --autogenerate`?"
  - "Can Alembic auto-detect column renames? Why or why not?"
  - "What should you do before deploying a migration to production?"
